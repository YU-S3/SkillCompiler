[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcompiler"
version = "0.1.0"
description = "A task-agnostic framework for learning, compiling, and refining reusable agent skills"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "jsonschema>=4.20", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skillcompiler = "skillcompiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
