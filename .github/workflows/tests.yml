name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m examples.offline_demo --output runs/demo
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: |
          docker pull python:3.12-slim
          echo "SKILLCOMPILER_TEST_IMAGE=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - run: pytest -q tests/test_worker.py
